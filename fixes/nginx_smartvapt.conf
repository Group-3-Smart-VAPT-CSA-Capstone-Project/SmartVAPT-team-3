# SmartVAPT remediation config — fixes the 7 findings from scan 20260929_032224
#
# Findings addressed:
#   [HIGH]   No HTTP -> HTTPS redirect          -> server block 1 (301 redirect)
#   [MED]    Missing Strict-Transport-Security  -> add_header HSTS (HTTPS block only)
#   [MED]    Missing Content-Security-Policy    -> add_header CSP
#   [MED]    Missing X-Frame-Options            -> add_header DENY
#   [MED]    Missing X-Content-Type-Options     -> add_header nosniff
#   [MED]    Missing Referrer-Policy            -> add_header strict-origin-when-cross-origin
#   [MED]    Missing Permissions-Policy         -> add_header restrictive policy
#
# Deployment (Debian/Ubuntu):
#   sudo cp fixes/nginx_smartvapt.conf /etc/nginx/sites-available/default
#   # edit server_name + root + certificate paths, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Note: HSTS must NOT be sent over plain HTTP (browsers ignore it there and
# RFC 6797 forbids it), so it lives only in the HTTPS server block.

# --- HTTP: permanent redirect to HTTPS (fixes "No HTTP -> HTTPS redirect") ---
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # ACME challenge must stay reachable over HTTP for cert renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: hardened site with all missing security headers ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/html;
    index index.html;

    # always=true: headers are also emitted on error responses (4xx/5xx),
    # otherwise nginx drops add_header results from proxy/error handlers.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Bonus hardening (not required by the findings)
    server_tokens off;
}
