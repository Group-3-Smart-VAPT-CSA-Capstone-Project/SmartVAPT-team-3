# SmartVAPT remediation — HTTP -> HTTPS enforcement for scanme.nmap.org
# (scan 20261001_042608). The scan showed http://scanme.nmap.org returns
# HTTP 200 directly instead of redirecting to https:// (same profile as the
# prior example.com "No HTTP -> HTTPS redirect" high finding).
#
# Deploy inside the port-80 VirtualHost of the target Apache server:
#   sudo a2enmod rewrite ssl
#   sudo apachectl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName scanme.nmap.org

    # ACME challenge must stay reachable over HTTP for certificate renewal
    DocumentRoot /var/www/html
    <Directory "/var/www/html/.well-known/acme-challenge">
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName scanme.nmap.org
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/scanme.nmap.org/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/scanme.nmap.org/privkey.pem
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite          HIGH:!aNULL:!MD5

    # hardened headers (incl. HSTS over TLS) come from smartvapt-security.conf
    IncludeOptional conf-available/scanme_apache_security.conf
</VirtualHost>
