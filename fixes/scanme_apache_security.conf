# SmartVAPT remediation config — fixes the 6 WEB-00x header findings from
# scan 20261001_042608 (target http://scanme.nmap.org, Apache/2.4.7 port 80).
#
# Findings addressed (all Medium / A05:2021 Security Misconfiguration):
#   [MED] Missing Strict-Transport-Security  -> Header always set HSTS (TLS vhost only, RFC 6797)
#   [MED] Missing Content-Security-Policy    -> Header always set CSP below
#   [MED] Missing X-Frame-Options            -> Header always set DENY
#   [MED] Missing X-Content-Type-Options     -> Header always set nosniff
#   [MED] Missing Referrer-Policy            -> Header always set strict-origin-when-cross-origin
#   [MED] Missing Permissions-Policy         -> Header always set restrictive policy
#
# Deployment (Debian/Ubuntu Apache):
#   sudo a2enmod headers rewrite ssl
#   sudo cp fixes/scanme_apache_security.conf /etc/apache2/conf-available/smartvapt-security.conf
#   # include this file from BOTH the :80 and :443 vhosts (or conf.d for global),
#   then: sudo apachectl configtest && sudo systemctl reload apache2
#
# NOTE: HSTS is emitted only when TLS is in use (browsers ignore it over plain
# HTTP and RFC 6797 forbids sending it there). Pair with
# scanme_apache_redirect.conf to force HTTP -> HTTPS first.

# --- The 5 headers that are safe (and required) on every response ----------
<IfModule mod_headers.c>
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always set Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

    # HSTS only over TLS connections
    <If "%{HTTPS} == 'on'">
        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    </If>

    # Reduce information disclosure (Server header banner)
    ServerTokens Prod
</IfModule>
